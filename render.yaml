services:
  - type: web
    name: medintel-rag-api
    env: python
    runtime: python-3.11.10
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      bash scripts/download_vector_store.sh || echo "No vector store URL provided, will need manual upload"
    startCommand: gunicorn src.api:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VECTOR_STORE_URL
        sync: false  # Add this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # set this secret in the Render dashboard (never commit it)
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: MAX_TOKENS
        value: "8192"
      - key: TOP_K_DOCUMENTS
        value: "12"
      - key: RETRIEVAL_CONFIDENCE_THRESHOLD
        value: "0.3"
      - key: VECTOR_STORE_PATH
        value: ./data/vector_store
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: NEIGHBOR_WINDOW
        value: "1"
      - key: MAX_CONTEXT_CHARS
        value: "60000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
